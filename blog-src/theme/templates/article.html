<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ article.summary | striptags }}">
    <meta name="author" content="rezn1r">
    <title>{{ article.title | striptags }} | rezn1r</title>
    <meta name="theme-color" content="#b84c4c" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../style/minecraft.css">
    <link rel="stylesheet" href="../style/index.css">
</head>
<body>
    <header class="navbar site-header">
        <div class="container navbar-inner">
            <a class="navbar-brand" href="/">rezn1r</a>
            <nav aria-label="Blog navigation">
                <ul class="navbar-nav">
                    <li><a href="/#home">Home</a></li>
                    <li><a href="/#blog">Blog</a></li>
                    <li><a href="/#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="container blog-post-layout">
            <a class="button button-secondary" href="/#blog">Back to Blog</a>
            <article class="blog-post-card" style="margin-top: 16px;">
                <h1 class="blog-post-title">{{ article.title }}</h1>
                <p class="blog-post-meta">
                    {{ article.date.strftime('%b %d, %Y') }}
                </p>
                {% if article.tags %}
                <div class="blog-tags" style="margin-bottom: 14px;">
                    {% for tag in article.tags %}
                    <span class="blog-tag">{{ tag }}</span>
                    {% endfor %}
                </div>
                {% endif %}
                <div class="blog-post-content">
                    {{ article.content }}
                </div>
            </article>
        </section>
    </main>

    <script>
        (() => {
            const content = document.querySelector(".blog-post-content");
            if (!content) {
                return;
            }

            content.querySelectorAll("img").forEach((img) => {
                if (img.closest("a")) {
                    return;
                }

                const link = document.createElement("a");
                link.className = "blog-post-image-link";
                link.href = img.src;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.title = "Open image source";
                img.parentNode.insertBefore(link, img);
                link.append(img);
            });
        })();
    </script>
</body>
</html>
